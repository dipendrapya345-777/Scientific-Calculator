<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A modern scientific calculator built with HTML, CSS and JavaScript">

    <title>NovaCalc — Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="calculator">

            <!-- Header -->
            <header class="topbar">
                <div>
                    <p class="eyebrow">ADVANCED</p>
                    <h1>NovaCalc</h1>
                </div>

                <div class="top-actions">
                    <button id="angleMode" class="small-button">
                        DEG
                    </button>

                    <button id="themeToggle" class="small-button" aria-label="Toggle theme">
                        ☀
                    </button>
                </div>
            </header>


            <!-- Display -->
            <section class="display">

                <div id="expression" class="expression">
                    Ready
                </div>

                <div id="result" class="result">
                    0
                </div>

            </section>


            <!-- Memory -->
            <section class="memory-row">

                <button data-action="memory-clear">MC</button>
                <button data-action="memory-recall">MR</button>
                <button data-action="memory-add">M+</button>
                <button data-action="memory-subtract">M−</button>

            </section>


            <!-- Scientific Functions -->
            <section class="scientific-grid">

                <button data-action="second">2nd</button>
                <button data-value="(">(</button>
                <button data-value=")">)</button>
                <button data-action="percent">%</button>
                <button data-action="reciprocal">1/x</button>

                <button data-action="sin">sin</button>
                <button data-action="cos">cos</button>
                <button data-action="tan">tan</button>
                <button data-action="log">log</button>
                <button data-action="ln">ln</button>

                <button data-action="sqrt">√</button>
                <button data-action="cbrt">∛</button>
                <button data-action="square">x²</button>
                <button data-action="power">xʸ</button>
                <button data-action="factorial">x!</button>

                <button data-value="π">π</button>
                <button data-value="e">e</button>
                <button data-action="ans">Ans</button>
                <button data-action="absolute">|x|</button>
                <button data-action="backspace">⌫</button>

            </section>


            <!-- Main Calculator -->
            <section class="keypad">

                <button class="clear" data-action="clear">AC</button>
                <button class="operator" data-action="backspace">DEL</button>
                <button class="operator" data-value="/">÷</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="equals" data-action="calculate">=</button>

                <button class="zero" data-value="0">0</button>
                <button data-value=".">.</button>

            </section>


            <!-- History -->
            <section class="history">

                <div class="history-header">
                    <h2>History</h2>

                    <button id="clearHistory">
                        Clear
                    </button>
                </div>

                <div id="historyList" class="history-list">
                    <p class="empty-history">
                        Your calculations will appear here.
                    </p>
                </div>

            </section>


            <footer>
                <span>NovaCalc</span>
                <span>HTML • CSS • JavaScript</span>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
